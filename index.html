<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#6c5ce7">
<title>Tablorigolo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%86%3C/text%3E%3C/svg%3E">
<style>
  :root { --ink:#2b2260; --violet:#6c5ce7; --gap:4px; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; overflow:hidden; overscroll-behavior:none; touch-action:manipulation;
    -webkit-user-select:none; user-select:none; color:var(--ink);
    font-family: ui-rounded, "SF Pro Rounded", "Nunito", "Segoe UI", "Trebuchet MS", system-ui, sans-serif; }
  body { background:
      radial-gradient(circle at 15% 10%, #ffeaa7 0, transparent 38%),
      radial-gradient(circle at 90% 92%, #fab1a0 0, transparent 42%),
      linear-gradient(160deg, #74b9ff 0%, #a29bfe 55%, #fd79a8 100%); }
  button { font:inherit; color:inherit; border:0; cursor:pointer; }

  .screen { position:absolute; inset:0; display:none; overflow:auto; }
  .screen.active { display:flex; }

  /* ---------- Boutons ---------- */
  .btn { background:#fff; border-radius:18px; padding:12px 18px; font-weight:800; font-size:clamp(16px,2.2vw,20px);
    box-shadow:0 5px 0 rgba(43,34,96,.22); transition:transform .08s, box-shadow .08s; min-height:52px; }
  .btn:active { transform:translateY(4px); box-shadow:0 1px 0 rgba(43,34,96,.22); }
  .btn.primary { background:linear-gradient(180deg,#55efc4,#00b894); color:#fff; text-shadow:0 2px 0 rgba(0,0,0,.18); }
  .btn.big { font-size:clamp(22px,3.4vw,32px); padding:16px 40px; border-radius:26px; }
  .btn[disabled] { opacity:.5; pointer-events:none; }

  /* ---------- Écran réglages ---------- */
  #screen-setup { flex-direction:column; align-items:center; padding:calc(18px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom)); gap:14px; }
  #screen-setup h1 { margin:6px 0 0; font-size:clamp(40px,7vw,68px); line-height:1; color:#fff; letter-spacing:1px;
    text-shadow:0 4px 0 rgba(43,34,96,.35); }
  #screen-setup .sub { margin:0; font-weight:700; font-size:clamp(16px,2.4vw,22px); color:#fff; text-shadow:0 2px 0 rgba(43,34,96,.3); }
  .card { background:rgba(255,255,255,.92); border-radius:28px; padding:20px 22px; width:min(720px,100%);
    box-shadow:0 10px 30px rgba(43,34,96,.25); display:flex; flex-direction:column; gap:10px; }
  .card h2 { margin:8px 0 0; font-size:clamp(18px,2.4vw,22px); }
  .chips { display:flex; flex-wrap:wrap; gap:10px; }
  .chip { width:clamp(54px,9vw,70px); height:clamp(54px,9vw,70px); border-radius:18px; background:#eceaff; font-weight:900;
    font-size:clamp(22px,3.4vw,30px); box-shadow:0 4px 0 rgba(43,34,96,.18); }
  .chip[aria-pressed="true"] { background:linear-gradient(180deg,#ffd166,#ff9f43); color:#fff; text-shadow:0 2px 0 rgba(0,0,0,.2); }
  .quick { display:flex; gap:8px; flex-wrap:wrap; }
  .quick .btn { min-height:44px; padding:8px 14px; font-size:16px; background:#f3f1ff; }
  .seg { display:flex; gap:8px; flex-wrap:wrap; }
  .seg button { flex:1 1 88px; min-height:54px; border-radius:16px; background:#eceaff; font-weight:800;
    font-size:clamp(16px,2.2vw,20px); box-shadow:0 4px 0 rgba(43,34,96,.18); }
  .seg button[aria-pressed="true"] { background:linear-gradient(180deg,#a29bfe,#6c5ce7); color:#fff; text-shadow:0 2px 0 rgba(0,0,0,.2); }
  .sec { display:flex; flex-direction:column; gap:10px; }
  [hidden] { display:none !important; }
  .seg small { font-weight:700; opacity:.8; font-size:.8em; }
  .warn { color:#d63031; font-weight:800; min-height:1.4em; text-align:center; margin:0; }

  /* ---------- Écran de jeu ---------- */
  #screen-game { flex-direction:column; height:100vh; height:100dvh;
    padding:calc(10px + env(safe-area-inset-top)) 14px calc(10px + env(safe-area-inset-bottom)); gap:8px; overflow:hidden; }
  .topbar { display:flex; align-items:center; gap:10px; flex:0 0 auto; flex-wrap:wrap; }
  .topbar .spacer { flex:1; }
  .topbar .btn { flex:0 0 auto; }
  .topbar .info { flex:0 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .topbar .info { font-weight:800; color:var(--ink); background:rgba(255,255,255,.75); border-radius:14px; padding:8px 14px; font-size:clamp(15px,2vw,19px); }
  .hint { flex:0 0 auto; text-align:center; font-weight:800; min-height:1.7em; font-size:clamp(17px,2.4vw,24px);
    color:#fff; text-shadow:0 2px 0 rgba(43,34,96,.35); margin:0; }
  .play { flex:1; min-height:0; display:grid; grid-template-columns:1fr minmax(270px,340px); gap:14px; }
  @media (orientation:portrait) { .play { grid-template-columns:1fr; grid-template-rows:minmax(0,1fr) auto; } }
  #board-wrap { min-width:0; min-height:0; display:flex; align-items:center; justify-content:center; overflow:auto; }
  #board { margin:auto; flex:0 0 auto; }
  #board { display:grid; gap:var(--gap); padding:14px; background:rgba(255,255,255,.6); border-radius:26px;
    box-shadow:0 10px 30px rgba(43,34,96,.22); --cell:48px; }

  .cell { width:var(--cell); height:var(--cell); display:flex; align-items:center; justify-content:center;
    border-radius:calc(var(--cell)*.2); font-weight:900; font-size:calc(var(--cell)*.52); line-height:1; position:relative; }
  .cell.len3 { font-size:calc(var(--cell)*.38); }
  .cell.op { font-size:calc(var(--cell)*.46); background:hsl(var(--h) 90% 90%); color:hsl(var(--h) 65% 36%); }
  .cell.num { border:3px solid hsl(var(--h) 70% 58%); background:#fff; color:#3b2fa8; }
  .cell.num.x { border-color:hsl(var(--h) 70% 58%) hsl(var(--h2) 70% 58%) hsl(var(--h2) 70% 58%) hsl(var(--h) 70% 58%); }
  .cell.num.blank.x { background:linear-gradient(135deg, hsl(var(--h) 100% 95%) 50%, hsl(var(--h2) 100% 95%) 50%); }
  .cell.num.given { background:#ffe08a; border-color:#f0a500; color:#5a3d00; }
  .cell.num.blank { cursor:pointer; }
  .cell.peer { box-shadow:0 0 0 3px rgba(108,92,231,.35); }
  .cell.sel { transform:scale(1.1); box-shadow:0 0 0 4px #fff, 0 0 0 8px var(--violet); z-index:2; }
  .cell.sel.blank:empty::after { content:""; width:3px; height:55%; background:var(--violet); border-radius:2px; animation:blink 1s steps(2) infinite; }
  .cell.wrong { background:#ffd9d9 !important; border-color:#e03131 !important; color:#c92a2a !important; animation:shake .45s; }
  .cell.need { animation:pulse .6s 2; }
  .cell.ok { background:#c9f7c3 !important; border-color:#2f9e44 !important; color:#1b6b2b !important; animation:pop .55s both; animation-delay:var(--d,0s); }
  @keyframes blink { 50% { opacity:0; } }
  @keyframes shake { 0%,100% { transform:translateX(0); } 20% { transform:translateX(-6px); } 40% { transform:translateX(6px); } 60% { transform:translateX(-4px); } 80% { transform:translateX(4px); } }
  @keyframes pulse { 50% { transform:scale(1.12); background:#fff3bf; } }
  @keyframes pop { 0% { transform:scale(1); } 50% { transform:scale(1.25); } 100% { transform:scale(1); } }

  /* ---------- Pavé numérique ---------- */
  .pad { align-self:center; justify-self:center; width:100%; max-width:360px; display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  @media (orientation:portrait) { .pad { max-width:440px; gap:8px; } }
  .key { height:clamp(54px,9.5vh,78px); border-radius:20px; background:#fff; font-weight:900; font-size:clamp(26px,4vh,36px);
    box-shadow:0 5px 0 rgba(43,34,96,.22); transition:transform .06s, box-shadow .06s; color:var(--ink); }
  .key:active { transform:translateY(4px); box-shadow:0 1px 0 rgba(43,34,96,.22); }
  .key.fn { background:#dfe6ff; font-size:clamp(22px,3.4vh,30px); }
  .pad .verify { grid-column:1 / -1; height:clamp(58px,10vh,84px); font-size:clamp(22px,3.4vh,32px); margin-top:6px; }


  /* ---------- Téléphone / petits écrans ---------- */
  @media (max-width:640px) {
    #screen-game { padding:calc(6px + env(safe-area-inset-top)) 8px calc(6px + env(safe-area-inset-bottom)); gap:4px; }
    .topbar { flex-wrap:nowrap; gap:6px; }
    .topbar .btn { min-height:44px; padding:6px 12px; font-size:18px; border-radius:14px; box-shadow:0 3px 0 rgba(43,34,96,.22); }
    .topbar .lbl { display:none; }
    .topbar .info { padding:6px 10px; font-size:14px; }
    .hint { font-size:15px; min-height:1.3em; }
    #board { padding:8px; border-radius:18px; }
    .pad { grid-template-columns:repeat(10,1fr); gap:5px; max-width:none; }
    .pad .key { order:11; height:50px; font-size:24px; border-radius:12px; box-shadow:0 3px 0 rgba(43,34,96,.22); padding:0; }
    .pad .key[data-d="1"] { order:1; } .pad .key[data-d="2"] { order:2; } .pad .key[data-d="3"] { order:3; }
    .pad .key[data-d="4"] { order:4; } .pad .key[data-d="5"] { order:5; } .pad .key[data-d="6"] { order:6; }
    .pad .key[data-d="7"] { order:7; } .pad .key[data-d="8"] { order:8; } .pad .key[data-d="9"] { order:9; }
    .pad .key[data-d="0"] { order:10; }
    .pad .key[data-act="del"] { order:11; grid-column:span 3; font-size:22px; }
    .pad .key[data-act="next"] { order:12; grid-column:span 3; font-size:22px; }
    .pad .verify { order:13; grid-column:span 4; height:50px; font-size:19px; margin-top:0; border-radius:12px; box-shadow:0 3px 0 rgba(43,34,96,.22); padding:0; }
  }
  /* téléphone en paysage : peu de hauteur */
  @media (max-height:520px) and (orientation:landscape) {
    #screen-game { gap:3px; padding-top:calc(4px + env(safe-area-inset-top)); padding-bottom:calc(4px + env(safe-area-inset-bottom)); }
    .topbar .btn { min-height:40px; padding:4px 12px; font-size:16px; }
    .hint { font-size:15px; min-height:1.2em; }
    .play { grid-template-columns:1fr minmax(230px,300px); gap:8px; }
    .pad { gap:6px; }
    .pad .key { height:40px; font-size:22px; border-radius:12px; }
    .pad .verify { height:44px; font-size:19px; margin-top:2px; }
    #board { padding:8px; }
  }

  /* ---------- Chrono / classement ---------- */
  input { -webkit-user-select:text; user-select:text; }
  .timer { flex:0 0 auto; font-weight:900; font-size:clamp(18px,2.6vw,26px); font-variant-numeric:tabular-nums; background:#fff;
    border-radius:14px; padding:6px 14px; box-shadow:0 3px 0 rgba(43,34,96,.18); min-width:4.4em; text-align:center; }
  .name { width:100%; min-height:54px; border-radius:16px; border:3px solid #d9d4ff; background:#fff; padding:8px 16px;
    font:inherit; font-weight:800; font-size:clamp(18px,2.4vw,22px); color:var(--ink); }
  .name:focus { outline:none; border-color:var(--violet); }
  #lb { position:fixed; inset:0; z-index:40; background:rgba(43,34,96,.55); display:flex; align-items:center; justify-content:center; padding:16px; }
  #lb.hidden { display:none; }
  #lb .box { background:#fff; border-radius:28px; padding:20px 20px 18px; width:min(480px,100%); max-height:94vh; overflow:auto;
    box-shadow:0 14px 40px rgba(43,34,96,.45); display:flex; flex-direction:column; gap:10px; }
  #lb h2 { margin:0; font-size:clamp(24px,4vw,32px); text-align:center; }
  #lb .cfg { margin:0; text-align:center; font-weight:700; opacity:.75; }
  #lb ol { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px; }
  #lb li { display:grid; grid-template-columns:2.2em 1fr auto auto; gap:8px; align-items:center; background:#f3f1ff; border-radius:14px;
    padding:8px 12px; font-weight:800; font-size:clamp(16px,2.4vw,20px); }
  #lb li.me { background:#ffe08a; box-shadow:0 0 0 3px #f0a500; }
  #lb li .t { font-variant-numeric:tabular-nums; }
  #lb li .d { font-size:.7em; opacity:.6; font-weight:700; }
  #lb .empty { text-align:center; font-weight:700; padding:14px 0; margin:0; }
  #lb .row { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  #lb .row .btn { min-height:48px; }
  .ini { display:flex; gap:14px; justify-content:center; margin:4px 0 12px; }
  .slot { display:flex; flex-direction:column; align-items:center; gap:4px; }
  .arr { width:64px; height:44px; border-radius:14px; background:#eceaff; font-size:22px; font-weight:900; box-shadow:0 3px 0 rgba(43,34,96,.18); }
  .arr:active { transform:translateY(2px); box-shadow:0 1px 0 rgba(43,34,96,.18); }
  .ltr { font-size:clamp(40px,8vw,56px); font-weight:900; line-height:1.1; width:1.3em; text-align:center; background:#fff3bf; border-radius:14px; border:3px solid #f0a500; }
  #win .ask { margin:6px 0 4px; font-weight:800; }
  #win .time { font-size:clamp(26px,4.4vw,38px); font-weight:900; margin:6px 0 0; }
  #win .rank { margin:4px 0 14px; font-weight:800; }

  /* ---------- Victoire ---------- */
  #win { position:fixed; left:50%; bottom:calc(5vh + env(safe-area-inset-bottom)); transform:translateX(-50%); z-index:30;
    background:rgba(255,255,255,.96); border-radius:30px; padding:22px 30px; text-align:center; width:min(520px,92vw);
    box-shadow:0 14px 40px rgba(43,34,96,.4); animation:rise .5s both; }
  #win.hidden { display:none; }
  #win h2 { margin:0; font-size:clamp(34px,6vw,52px); line-height:1.1; }
  #win p { margin:8px 0 8px; font-weight:700; font-size:clamp(16px,2.4vw,22px); }
  #win .row { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
  @keyframes rise { from { transform:translate(-50%,40px); opacity:0; } to { transform:translate(-50%,0); opacity:1; } }
  #fx { position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:20; }
</style>
</head>
<body>

<!-- ============ RÉGLAGES ============ -->
<section id="screen-setup" class="screen active">
  <h1>Tablorigolo</h1>
  <p class="sub">Complète les opérations croisées !</p>
  <div class="card">
    <h2>Que veux-tu travailler ?</h2>
    <div class="seg" id="seg-mode">
      <button data-val="mult">✖️ Multiplication</button>
      <button data-val="add">➕ Addition</button>
      <button data-val="mix">🎲 Mélange</button>
    </div>
    <div id="sec-tables" class="sec">
      <h2>Quelles tables ?</h2>
      <div id="tables" class="chips"></div>
      <div class="quick">
        <button class="btn" data-quick="234">2 · 3 · 4</button>
        <button class="btn" data-quick="all">Toutes</button>
        <button class="btn" data-quick="none">Aucune</button>
      </div>
    </div>
    <div id="sec-add" class="sec" hidden>
      <h2>Additions jusqu'à…</h2>
      <div class="seg" id="seg-addlevel">
        <button data-val="a10">≤ 10</button>
        <button data-val="a20">≤ 20</button>
        <button data-val="a100">≤ 100<br><small>sans retenue</small></button>
        <button data-val="a100r">≤ 100<br><small>avec retenue</small></button>
      </div>
    </div>
    <h2>Difficulté</h2>
    <div class="seg" id="seg-diff">
      <button data-val="facile">😀 Facile</button>
      <button data-val="moyen">🙂 Moyen</button>
      <button data-val="difficile">🤓 Difficile</button>
    </div>
    <h2>Taille de la grille</h2>
    <div class="seg" id="seg-size">
      <button data-val="petite">Petite</button>
      <button data-val="moyenne">Moyenne</button>
      <button data-val="grande">Grande</button>
    </div>
    <h2>Sons</h2>
    <div class="seg" id="seg-sound">
      <button data-val="on">🔊 Avec sons</button>
      <button data-val="off">🔇 Sans son</button>
    </div>
  </div>
  <p id="setup-warn" class="warn"></p>
  <button id="btn-play" class="btn primary big">Jouer ▶</button>
  <button id="btn-lb-setup" class="btn">🏆 Voir le classement</button>
</section>

<!-- ============ JEU ============ -->
<section id="screen-game" class="screen">
  <div class="topbar">
    <button id="btn-settings" class="btn" aria-label="Réglages">⚙️<span class="lbl"> Réglages</span></button>
    <span id="info" class="info"></span>
    <span id="timer" class="timer" aria-label="Chrono">⏱ 0:00</span>
    <span class="spacer"></span>
    <button id="btn-sound" class="btn" aria-label="Son">🔊</button>
    <button id="btn-new" class="btn" aria-label="Nouvelle grille">🔄<span class="lbl"> Nouvelle grille</span></button>
  </div>
  <p id="hint" class="hint" aria-live="polite"></p>
  <div class="play">
    <div id="board-wrap"><div id="board"></div></div>
    <div class="pad" id="pad">
      <button class="key" data-d="1">1</button><button class="key" data-d="2">2</button><button class="key" data-d="3">3</button>
      <button class="key" data-d="4">4</button><button class="key" data-d="5">5</button><button class="key" data-d="6">6</button>
      <button class="key" data-d="7">7</button><button class="key" data-d="8">8</button><button class="key" data-d="9">9</button>
      <button class="key fn" data-act="del" aria-label="Effacer">⌫</button>
      <button class="key" data-d="0">0</button>
      <button class="key fn" data-act="next" aria-label="Case suivante">➜</button>
      <button class="btn primary verify" id="btn-verify">✔ Vérifier</button>
    </div>
  </div>
</section>

<!-- ============ VICTOIRE ============ -->
<div id="win" class="hidden">
  <h2>🎉 Bravo !</h2>
  <p class="time" id="win-time"></p>
  <div id="win-entry">
    <p class="ask">Entre tes 3 lettres pour le classement :</p>
    <div class="ini">
      <div class="slot"><button class="arr" data-i="0" data-d="1" aria-label="Lettre suivante">▲</button><span class="ltr" id="ltr0">A</span><button class="arr" data-i="0" data-d="-1" aria-label="Lettre précédente">▼</button></div>
      <div class="slot"><button class="arr" data-i="1" data-d="1" aria-label="Lettre suivante">▲</button><span class="ltr" id="ltr1">A</span><button class="arr" data-i="1" data-d="-1" aria-label="Lettre précédente">▼</button></div>
      <div class="slot"><button class="arr" data-i="2" data-d="1" aria-label="Lettre suivante">▲</button><span class="ltr" id="ltr2">A</span><button class="arr" data-i="2" data-d="-1" aria-label="Lettre précédente">▼</button></div>
    </div>
    <div class="row">
      <button id="btn-ini-ok" class="btn primary big">Valider ✔</button>
      <button id="btn-ini-skip" class="btn">Passer</button>
    </div>
  </div>
  <div id="win-after" hidden>
    <p class="rank" id="win-rank"></p>
    <div class="row">
      <button id="btn-replay" class="btn primary big">Rejouer 🔄</button>
      <button id="btn-win-lb" class="btn">🏆 Classement</button>
      <button id="btn-win-settings" class="btn">⚙️ Réglages</button>
    </div>
  </div>
</div>
<div id="lb" class="hidden">
  <div class="box">
    <h2>🏆 Classement</h2>
    <p class="cfg" id="lb-cfg"></p>
    <ol id="lb-list"></ol>
    <div class="row">
      <button id="btn-lb-reset" class="btn">🗑 Effacer</button>
      <button id="btn-lb-close" class="btn primary">Fermer</button>
    </div>
  </div>
</div>
<canvas id="fx"></canvas>

<script>
(() => {
'use strict';

/* =====================================================================
   GÉNÉRATEUR DE GRILLES  (code pur, testé séparément)
   ===================================================================== */
// ==== GENERATOR START
const COUNTS  = { petite: 4, moyenne: 6, grande: 8 };
const MAXDIM  = { petite: 11, moyenne: 13, grande: 15 };
const FRACS   = { facile: 0.6, moyen: 0.4, difficile: 0.22 };

function rnd(n) { return Math.floor(Math.random() * n); }
function pick(a) { return a[rnd(a.length)]; }

// Une équation = 5 cases : [a op b = c]  ou, à l'envers, [c = a op b]
function mkCand(type, a, b, rev) {
  const c = type === 'add' ? a + b : a * b, op = type === 'add' ? '+' : '×';
  return { type, a, b, c, rev, sig: type + Math.min(a, b) + '_' + Math.max(a, b),
           vals: rev ? [c, '=', a, op, b] : [a, op, b, '=', c] };
}
function buildMultCands(tables) {
  const seen = new Set(), list = [];
  for (const t of tables) for (let o = 2; o <= 10; o++) for (const [a, b] of [[t, o], [o, t]]) for (const rev of [false, true]) {
    const id = a + 'x' + b + (rev ? 'r' : '');
    if (seen.has(id)) continue;
    seen.add(id); list.push(mkCand('mult', a, b, rev));
  }
  return list;
}
function buildAddCands(level) {
  const list = [];
  const ok = (a, b) => {
    const c = a + b, ua = a % 10, ub = b % 10;
    if (level === 'a10') return c <= 10;
    if (level === 'a20') return a >= 2 && b >= 2 && c <= 20;
    if (a < 10 && b < 10) return false;       // pas d'addition à un chiffre dans les niveaux 100
    if (ua === 0 && ub === 0) return false;   // 20 + 30 : trop facile
    if (level === 'a100') return ua + ub < 10 && c <= 99;   // sans retenue
    return ua + ub >= 10 && c <= 100;                      // avec retenue
  };
  for (let a = 1; a <= 99; a++) for (let b = 1; b <= 99; b++) if (ok(a, b)) for (const rev of [false, true]) list.push(mkCand('add', a, b, rev));
  return list;
}
function buildCands(opts) {
  const mode = opts.mode || 'mult';
  let list = [];
  if (mode !== 'add') list = list.concat(buildMultCands(opts.tables && opts.tables.length ? opts.tables : [2, 3, 4]));
  if (mode !== 'mult') list = list.concat(buildAddCands(opts.addLevel || 'a100'));
  return list;
}
// valeur -> [[équation, position]] pour trouver vite les équations qui passent par une case donnée
function buildIndex(cands) {
  const m = new Map();
  for (const c of cands) for (const k of [0, 2, 4]) {
    const v = c.vals[k];
    if (!m.has(v)) m.set(v, []);
    m.get(v).push([c, k]);
  }
  return m;
}

function tryLayout(cands, idx, count, maxDim) {
  const cells = new Map();   // "r,c" -> cellule
  const eqs = [];
  const usedSig = new Map();
  const typeCnt = {};
  const types = [...new Set(cands.map(c => c.type))];
  types.forEach(t => typeCnt[t] = 0);
  let bb = null;             // boîte englobante {r0,r1,c0,c1}

  const key = (r, c) => r + ',' + c;
  const merge = (b, pts) => {
    let r0 = b ? b.r0 : Infinity, r1 = b ? b.r1 : -Infinity, c0 = b ? b.c0 : Infinity, c1 = b ? b.c1 : -Infinity;
    for (const [r, c] of pts) { r0 = Math.min(r0, r); r1 = Math.max(r1, r); c0 = Math.min(c0, c); c1 = Math.max(c1, c); }
    return { r0, r1, c0, c1 };
  };
  const points = (dir, r0, c0) => Array.from({ length: 5 }, (_, i) => [r0 + (dir === 'V' ? i : 0), c0 + (dir === 'H' ? i : 0)]);

  function canPlace(cand, dir, r0, c0, crossKey) {
    const pts = points(dir, r0, c0);
    const set = new Set(pts.map(p => key(p[0], p[1])));
    const nb = merge(bb, pts);
    if (nb.r1 - nb.r0 + 1 > maxDim || nb.c1 - nb.c0 + 1 > maxDim) return false;
    for (let i = 0; i < 5; i++) {
      const [r, c] = pts[i], k = key(r, c), ex = cells.get(k);
      const along = dir === 'H' ? [[r, c - 1], [r, c + 1]] : [[r - 1, c], [r + 1, c]];
      const side  = dir === 'H' ? [[r - 1, c], [r + 1, c]] : [[r, c - 1], [r, c + 1]];
      if (ex) {
        if (k !== crossKey || ex.kind !== 'num' || i % 2 !== 0 || ex.value !== cand.vals[i] || ex[dir]) return false;
        for (const [rr, cc] of along) { const kk = key(rr, cc); if (cells.has(kk) && !set.has(kk)) return false; }
      } else {
        for (const [rr, cc] of along.concat(side)) { const kk = key(rr, cc); if (cells.has(kk) && !set.has(kk)) return false; }
      }
    }
    return true;
  }

  function place(cand, dir, r0, c0) {
    const id = eqs.length, pts = points(dir, r0, c0), keys = [];
    pts.forEach(([r, c], i) => {
      const k = key(r, c); keys.push(k);
      let cell = cells.get(k);
      if (!cell) { cell = { k, r, c, kind: i % 2 === 0 ? 'num' : 'op', value: cand.vals[i], eqs: [] }; cells.set(k, cell); }
      cell.eqs.push(id); cell[dir] = true;
    });
    eqs.push({ dir, keys, type: cand.type });
    usedSig.set(cand.sig, (usedSig.get(cand.sig) || 0) + 1);
    typeCnt[cand.type]++;
    bb = merge(bb, pts);
  }

  // première équation (type tiré au hasard pour équilibrer un mélange)
  const t0 = pick(types);
  place(pick(cands.filter(c => c.type === t0)), rnd(2) ? 'H' : 'V', 0, 0);

  while (eqs.length < count) {
    const options = [];
    const minType = Math.min(...types.map(t => typeCnt[t]));
    for (let ei = 0; ei < eqs.length; ei++) {
      const q = eqs[ei], ndir = q.dir === 'H' ? 'V' : 'H';
      for (const i of [0, 2, 4]) {
        const ck = q.keys[i], cell = cells.get(ck);
        if (cell[ndir]) continue;
        for (const [cand, k] of (idx.get(cell.value) || [])) {
          const r0 = ndir === 'V' ? cell.r - k : cell.r;
          const c0 = ndir === 'H' ? cell.c - k : cell.c;
          if (!canPlace(cand, ndir, r0, c0, ck)) continue;
          const nb = merge(bb, points(ndir, r0, c0));
          const area = (nb.r1 - nb.r0 + 1) * (nb.c1 - nb.c0 + 1);
          const dup = (usedSig.get(cand.sig) || 0) * 40;
          const bal = (typeCnt[cand.type] - minType) * 35;
          options.push({ cand, ndir, r0, c0, score: area + dup + bal + Math.random() * 18 });
        }
      }
    }
    if (!options.length) return null;
    options.sort((x, y) => x.score - y.score);
    const o = options[rnd(Math.min(5, options.length))];
    place(o.cand, o.ndir, o.r0, o.c0);
  }

  // normalisation des coordonnées
  const old = [...cells.values()];
  const newKey = new Map(old.map(c => [c.k, (c.r - bb.r0) + ',' + (c.c - bb.c0)]));
  const list = old.map(c => ({ k: newKey.get(c.k), r: c.r - bb.r0, c: c.c - bb.c0, kind: c.kind, value: c.value, eqs: c.eqs, given: false }));
  const outEqs = eqs.map(q => ({ dir: q.dir, type: q.type, keys: q.keys.map(k => newKey.get(k)) }));
  return { cols: bb.c1 - bb.c0 + 1, rows: bb.r1 - bb.r0 + 1, cells: list, eqs: outEqs };
}

function propagate(L, given) {
  const known = new Set(given);
  let changed = true;
  while (changed) {
    changed = false;
    for (const q of L.eqs) {
      const ks = [q.keys[0], q.keys[2], q.keys[4]];
      const unknown = ks.filter(k => !known.has(k));
      if (unknown.length === 1) { known.add(unknown[0]); changed = true; }
    }
  }
  return known;
}

function assignGivens(L, diff) {
  const frac = FRACS[diff] != null ? FRACS[diff] : FRACS.moyen;
  const nums = L.cells.filter(c => c.kind === 'num');
  const minBlank = Math.max(3, Math.ceil(nums.length * 0.25));
  let given = null;
  for (let t = 0; t < 80; t++) {
    const g = new Set(nums.filter(() => Math.random() < frac).map(c => c.k));
    for (;;) {                                   // on révèle des cases jusqu'à ce que tout soit déductible
      const known = propagate(L, g);
      if (known.size === nums.length) break;
      g.add(pick(nums.filter(c => !known.has(c.k))).k);
    }
    given = g;
    if (nums.length - g.size >= minBlank) break;
  }
  for (const c of L.cells) c.given = c.kind === 'num' && given.has(c.k);
  return L;
}

function generateGame(opts) {
  const count = COUNTS[opts.size] || 6, maxDim = MAXDIM[opts.size] || 13;
  const cands = buildCands(opts), idx = buildIndex(cands);
  let L = null;
  for (let n = count; n >= 2 && !L; n--) {
    for (let t = 0; t < 200 && !L; t++) L = tryLayout(cands, idx, n, maxDim + (n < count ? 2 : 0));
  }
  return assignGivens(L, opts.diff);
}
// ==== GENERATOR END

function audio() {
  if (!settings.sound) return null;
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();

function tone(freq, dur, type, vol, delay, slideTo) {
  const a = audio(); if (!a) return;
  const t0 = a.currentTime + (delay || 0), o = a.createOscillator(), g = a.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, t0);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol || 0.12, t0 + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

}
function noise(dur, vol, delay) {
  const a = audio(); if (!a) return;
  const n = Math.floor(a.sampleRate * dur), buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2.5);
  const s = a.createBufferSource(), g = a.createGain(), f = a.createBiquadFilter();
  f.type = 'lowpass'; f.frequency.value = 1800; g.gain.value = vol;
  s.buffer = buf; s.connect(f); f.connect(g); g.connect(a.destination);
  s.start(a.currentTime + (delay || 0));
}

    const res = addScore(pendingMs, settings.ini);
    txt = res.record ? '🏆 Nouveau record !' : res.rank <= 3 ? ['🥇 1re place !', '🥈 2e place !', '🥉 3e place !'][res.rank - 1]
      : res.rank <= 10 ? ordinal(res.rank) + ' place au classement' : 'Hors du top 10, tu peux faire mieux ! 💪';
  } else { lastId = null; txt = 'Temps non enregistré.'; }
  $('#win-rank').textContent = txt;
  $('#win-entry').hidden = true; $('#win-after').hidden = false;
  if (save) { sfx.ok(); showLb(); }
}
function win() {
  state.over = true;
  timerStop();
  const ms = elapsed(); pendingMs = ms;
  for (const k in els) { els[k].classList.remove('sel', 'peer', 'wrong'); }
  state.g.cells.forEach((c, i) => { els[c.k].classList.add('ok'); els[c.k].style.setProperty('--d', (i * 0.03) + 's'); });
  say('Bravo, tout est juste !');
  $('#win-time').textContent = '⏱ ' + fmtTime(ms);
  showEntry();
  $('#win').classList.remove('hidden');
  sfx.ok(); fxStart();
}
function hideWin() { $('#win').classList.add('hidden'); }

function fit() {
  if (!state) return;
  const wrap = $('#board-wrap'), cs = getComputedStyle(board);
  const pad = parseFloat(cs.paddingLeft) * 2 + 6, gap = 4;
  const w = wrap.clientWidth - pad - (state.g.cols - 1) * gap;
  const h = wrap.clientHeight - pad - (state.g.rows - 1) * gap;
  const size = Math.max(14, Math.min(80, Math.floor(Math.min(w / state.g.cols, h / state.g.rows))));
  board.style.setProperty('--cell', size + 'px');
}
window.addEventListener('resize', () => { fit(); fxResize(); });
window.addEventListener('orientationchange', () => setTimeout(() => { fit(); fxResize(); }, 200));

/* ---------- commandes ---------- */
$('#pad').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.d != null) typeDigit(+b.dataset.d);
  else if (b.dataset.act === 'del') backspace();
  else if (b.dataset.act === 'next') selectNext();
  else if (b.id === 'btn-verify') verify();
});
window.addEventListener('keydown', e => {
  if (!$('#win-entry').hidden && !$('#win').classList.contains('hidden')) {
    if (/^[a-zA-Z]$/.test(e.key)) { ini[iniCur] = e.key.toUpperCase(); $('#ltr' + iniCur).textContent = ini[iniCur]; iniCur = Math.min(2, iniCur + 1); }
    else if (e.key === 'Enter') finishEntry(true);
    return;
  }
  if (!$('#screen-game').classList.contains('active')) return;
  if (/^[0-9]$/.test(e.key)) typeDigit(+e.key);
  else if (e.key === 'Backspace') backspace();
  else if (e.key === 'Enter') verify();
  else if (e.key === 'Tab' || e.key === 'ArrowRight') { e.preventDefault(); selectNext(); }
});
$('#btn-play').addEventListener('click', () => { audio(); show('game'); newGame(); });
$('#btn-new').addEventListener('click', () => { sfx.tick(); newGame(); });
$('#btn-replay').addEventListener('click', () => { sfx.tick(); newGame(); });
$('#btn-settings').addEventListener('click', () => { timerStop(); fxStop(); hideWin(); show('setup'); });
$('#btn-win-settings').addEventListener('click', () => { fxStop(); hideWin(); show('setup'); });
document.querySelectorAll('.arr').forEach(b => b.addEventListener('click', () => rotate(+b.dataset.i, +b.dataset.d)));
$('#btn-ini-ok').addEventListener('click', () => finishEntry(true));
$('#btn-ini-skip').addEventListener('click', () => finishEntry(false));
$('#btn-lb-setup').addEventListener('click', () => { sfx.tick(); showLb(); });
$('#btn-win-lb').addEventListener('click', () => { sfx.tick(); showLb(); });
$('#btn-lb-close').addEventListener('click', () => { sfx.tick(); hideLb(); });
$('#lb').addEventListener('click', e => { if (e.target.id === 'lb') hideLb(); });
$('#btn-lb-reset').addEventListener('click', e => {
  const b = e.currentTarget;
  if (!b.dataset.armed) { b.dataset.armed = '1'; b.textContent = 'Sûr ? Rappuie'; setTimeout(() => { if (b.dataset.armed) { b.dataset.armed = ''; b.textContent = '🗑 Effacer'; } }, 4000); return; }
  const all = loadScores(); delete all[cfgKey()]; saveScores(all); lastId = null; showLb();
});
$('#btn-sound').addEventListener('click', () => { settings.sound = !settings.sound; saveSettings(); refreshSetup(); if (settings.sound) sfx.tick(); });

/* =====================================================================
   FEU D'ARTIFICE
   ===================================================================== */
const cv = $('#fx'), ctx = cv.getContext('2d');
let fxOn = false, raf = 0, rockets = [], sparks = [], nextLaunch = 0, W = 0, H = 0;

function fxResize() {
  const dpr = window.devicePixelRatio || 1;
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
function launch() {
  rockets.push({ x: W * (0.12 + Math.random() * 0.76), y: H, vy: -(H * 0.011 + Math.random() * H * 0.004),
                 ty: H * (0.12 + Math.random() * 0.35), hue: rnd(360) });
  sfx.launch();
}
function explode(x, y, hue) {
  const n = 80 + rnd(50), ring = Math.random() < 0.4, two = Math.random() < 0.3;
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, sp = ring ? 4.2 : 1.2 + Math.random() * 5;
    sparks.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1, decay: 0.008 + Math.random() * 0.012,
                  hue: two ? hue + (i % 2 ? 140 : 0) : hue + rnd(30), r: 1.6 + Math.random() * 1.8 });
  }
  sfx.boom();
}
function fxLoop(now) {
  if (!fxOn) return;
  ctx.globalCompositeOperation = 'destination-out';
  ctx.fillStyle = 'rgba(0,0,0,0.2)'; ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'lighter';
  if (now > nextLaunch) { launch(); nextLaunch = now + 350 + Math.random() * 600; }
  rockets = rockets.filter(r => {
    r.y += r.vy; r.vy *= 0.992;
    ctx.fillStyle = 'hsl(' + r.hue + ',100%,75%)';
    ctx.beginPath(); ctx.arc(r.x, r.y, 2.5, 0, 6.3); ctx.fill();
    if (r.y <= r.ty) { explode(r.x, r.y, r.hue); return false; }
    return true;
  });
  sparks = sparks.filter(s => {
    s.x += s.vx; s.y += s.vy; s.vx *= 0.985; s.vy = s.vy * 0.985 + 0.05; s.life -= s.decay;
    if (s.life <= 0) return false;
    ctx.fillStyle = 'hsla(' + s.hue + ',100%,62%,' + s.life + ')';
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r * (0.5 + s.life * 0.5), 0, 6.3); ctx.fill();
    return true;
  });
  raf = requestAnimationFrame(fxLoop);
}
function fxStart() {
  fxResize(); fxOn = true; rockets = []; sparks = []; nextLaunch = 0;
  launch(); setTimeout(launch, 250); setTimeout(launch, 500);
  cancelAnimationFrame(raf); raf = requestAnimationFrame(fxLoop);
}
function fxStop() {
  fxOn = false; cancelAnimationFrame(raf); rockets = []; sparks = [];
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.setTransform((window.devicePixelRatio || 1), 0, 0, (window.devicePixelRatio || 1), 0, 0);
}
fxResize();
})();
</script>
